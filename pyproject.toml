[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-tracker"
version = "0.1.0"
description = "Local Garmin strength-training and running tracker"
requires-python = ">=3.12"
dependencies = [
  "garminconnect==0.3.13",
]

[project.scripts]
garmin-tracker = "garmin_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
